    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Follow-up Manager — intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #12062e;
        --violet: #5b2be0;
        --purple: #8b3dff;
        --magenta: #d93fbf;
        --pink: #ff7ac0;
        --lavender: #efe9ff;
        --white: #ffffff;
        --ink-soft: rgba(239, 233, 255, 0.72);
        --glass: rgba(255, 255, 255, 0.07);
        --stroke: rgba(255, 255, 255, 0.16);
        --done: #4ade80;
        --wait: #fbbf24;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--white);
      }

      /* ── Background (decorative) ── */
      .bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .aurora {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
      }

      .aurora-violet {
        left: -300px;
        top: -340px;
        width: 1300px;
        height: 1000px;
        background: radial-gradient(circle, rgba(91, 43, 224, 0.75), transparent 68%);
      }

      .aurora-pink {
        right: -320px;
        bottom: -380px;
        width: 1300px;
        height: 1000px;
        background: radial-gradient(circle, rgba(217, 63, 191, 0.5), transparent 66%);
      }

      .aurora-blue {
        right: 260px;
        top: -400px;
        width: 900px;
        height: 700px;
        background: radial-gradient(circle, rgba(96, 120, 255, 0.3), transparent 70%);
      }

      .vignette {
        background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 45%, rgba(10, 3, 30, 0.7) 100%);
      }

      /* ── Hero frame: brand column + inbox panel ── */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 120px;
        padding: 120px 160px;
      }

      .brand {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
      }

      .logo {
        position: relative;
        width: 200px;
        height: 200px;
        margin-bottom: 44px;
        perspective: 1400px;
      }

      .bloom {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 520px;
        height: 520px;
        margin: -260px 0 0 -260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 63, 191, 0.5), rgba(91, 43, 224, 0.28) 40%, transparent 68%);
        filter: blur(18px);
      }

      .tile {
        position: absolute;
        inset: 0;
        border-radius: 52px;
        transform-style: preserve-3d;
        background:
          radial-gradient(120% 90% at 20% 0%, rgba(255, 255, 255, 0.28), transparent 45%),
          linear-gradient(150deg, #6a3cff 0%, #7b2cf0 42%, #b43ad8 72%, #ff5fae 100%);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.55),
          inset 0 -2px 0 rgba(255, 120, 200, 0.6),
          inset 0 -26px 40px rgba(255, 95, 174, 0.35),
          0 34px 60px rgba(10, 0, 40, 0.6),
          0 0 60px rgba(139, 61, 255, 0.45);
      }

      .tile-sheen-clip {
        position: absolute;
        inset: 0;
        border-radius: 52px;
        overflow: hidden;
      }

      .tile-sheen {
        position: absolute;
        top: -40%;
        left: 0;
        width: 45%;
        height: 180%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        transform: rotate(22deg);
        mix-blend-mode: overlay;
      }

      .envelope {
        position: absolute;
        left: 35px;
        top: 68px;
        width: 208px;
        height: 140px;
        transform: scale(0.625);
        transform-origin: 0 0;
        perspective: 900px;
      }

      .env-body {
        position: absolute;
        inset: 0;
        border-radius: 22px;
        background: linear-gradient(170deg, #ffffff 0%, #efe9ff 55%, #d8cbff 100%);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.9),
          inset 0 -4px 0 rgba(139, 61, 255, 0.18),
          0 14px 30px rgba(42, 15, 107, 0.45);
      }

      .env-groove {
        position: absolute;
        inset: 0;
      }

      .env-flap {
        position: absolute;
        left: 0;
        top: 0;
        width: 208px;
        height: 96px;
        transform-origin: 50% 0%;
        filter: drop-shadow(0 6px 6px rgba(91, 43, 224, 0.35));
      }

      .badge {
        position: absolute;
        right: 14px;
        top: 22px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f1ebff 55%, #d9cbff 100%);
        box-shadow:
          inset 0 -3px 0 rgba(139, 61, 255, 0.35),
          inset 0 2px 0 rgba(255, 255, 255, 0.9),
          0 4px 0 #6a3cff,
          0 12px 20px rgba(42, 15, 107, 0.55);
      }

      .badge-ring {
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.85);
      }

      .check {
        position: absolute;
        inset: 0;
        width: 72px;
        height: 72px;
      }

      .word {
        display: flex;
        font-size: 156px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.05em;
        filter: drop-shadow(0 0 28px rgba(217, 63, 191, 0.4)) drop-shadow(0 10px 30px rgba(10, 0, 40, 0.5));
      }

      .letter {
        display: inline-block;
      }

      .subtitle {
        display: flex;
        margin-top: 20px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.5em;
        color: var(--ink-soft);
      }

      .sub-letter {
        display: inline-block;
      }

      .loader {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 620px;
        margin-top: 64px;
      }

      .loader-row {
        position: relative;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        height: 34px;
        font-size: 26px;
        font-weight: 500;
        color: var(--ink-soft);
      }

      .status {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
      }

      .status-done {
        color: var(--white);
        font-weight: 600;
      }

      .status-dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--purple), var(--pink));
      }

      .percent {
        margin-left: auto;
        font-weight: 700;
        color: var(--white);
        font-variant-numeric: tabular-nums;
      }

      .track {
        height: 12px;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
      }

      .fill {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background: linear-gradient(90deg, var(--violet), var(--purple) 40%, var(--pink));
        box-shadow: 0 0 20px rgba(255, 122, 192, 0.6);
        transform-origin: 0 50%;
      }

      .tally {
        display: flex;
        gap: 36px;
        font-size: 22px;
        color: var(--ink-soft);
      }

      .tally strong {
        color: var(--white);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      /* Inbox panel */
      .panel {
        position: relative;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        width: 700px;
        height: 840px;
        border-radius: 40px;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
        border: 1px solid var(--stroke);
        box-shadow: 0 40px 80px rgba(10, 0, 40, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 30px 34px 22px;
        border-bottom: 1px solid var(--stroke);
        font-size: 26px;
        font-weight: 700;
      }

      .live {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--pink);
        box-shadow: 0 0 14px var(--pink);
      }

      .head-chip {
        margin-left: auto;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: 600;
        color: var(--lavender);
        background: rgba(139, 61, 255, 0.35);
      }

      .stream {
        position: relative;
        flex: 1;
        overflow: hidden;
        mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
      }

      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        margin-top: -1px;
        background: linear-gradient(90deg, transparent, var(--pink) 20%, var(--white) 50%, var(--pink) 80%, transparent);
        box-shadow: 0 0 22px 4px rgba(255, 122, 192, 0.55);
        z-index: 2;
      }

      .mail {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 0;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 88px;
        padding: 0 20px;
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--stroke);
      }

      .avatar {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        font-size: 18px;
        font-weight: 700;
        color: var(--white);
      }

      .mail-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        flex: 1;
      }

      .mail-from {
        font-size: 21px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mail-subject {
        font-size: 17px;
        color: var(--ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chips {
        position: relative;
        flex-shrink: 0;
        width: 168px;
        height: 36px;
      }

      .chip {
        position: absolute;
        right: 0;
        top: 0;
        display: flex;
        align-items: center;
        height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
      }

      .chip-new {
        color: var(--lavender);
        background: rgba(255, 255, 255, 0.14);
      }

      .chip-follow {
        color: #ffffff;
        background: linear-gradient(135deg, var(--violet), var(--purple));
      }

      .chip-remind {
        color: #2a0620;
        background: var(--pink);
      }

      .chip-wait {
        color: #2a1a00;
        background: var(--wait);
      }

      .chip-done {
        color: #052e14;
        background: var(--done);
      }
